name: Build Android APK

on:
  workflow_dispatch:   # فقط به صورت دستی اجرا می‌شود
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # این اکشن wrapper نداشتن را مدیریت می‌کند – نیازی به فایل gradlew نیست
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: ./gradlew assembleDebug -PworkerUrl="$WORKER_URL" -PsecretToken="$SECRET_TOKEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotiForwarder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
